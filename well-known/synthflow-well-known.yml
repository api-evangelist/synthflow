  - host: https://api.us.synthflow.ai
    paths: [/.well-known/security.txt, /.well-known/openid-configuration, /.well-known/oauth-authorization-server, /.well-known/api-catalog, /.well-known/ai-plugin.json, /.well-known/agent-card.json, /.well-known/agent.json]
