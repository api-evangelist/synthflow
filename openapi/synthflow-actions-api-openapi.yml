openapi: 3.2.0
info:
  title: PLATFORM Actions API
  version: 1.0.0
servers:
- url: https://api.synthflow.ai/v2
  description: Global
- url: https://api.us.synthflow.ai/v2
  description: United States
- url: https://api.eu.synthflow.ai/v2
  description: European Union
tags:
- name: Actions
paths:
  /actions:
    get:
      operationId: list-actions
      summary: List actions
      description: ''
      tags:
      - Actions
      parameters:
      - name: limit
        in: query
        description: Actions displayed per page.
        required: false
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        description: Index of the first action to be returned.
        required: false
        schema:
          type: integer
          default: 0
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list-actions_Response_200'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-actionsRequestBadRequestError'
    post:
      operationId: create-action
      summary: Create an action
      description: ''
      tags:
      - Actions
      parameters:
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create-action_Response_200'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Create-actionRequestBadRequestError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                REAL_TIME_BOOKING:
                  $ref: '#/components/schemas/ActionsPostRequestBodyContentApplicationJsonSchemaRealTimeBooking'
                INFORMATION_EXTRACTOR:
                  $ref: '#/components/schemas/ActionsPostRequestBodyContentApplicationJsonSchemaInformationExtractor'
                LIVE_TRANSFER:
                  $ref: '#/components/schemas/ActionsPostRequestBodyContentApplicationJsonSchemaLiveTransfer'
                SEND_SMS:
                  $ref: '#/components/schemas/ActionsPostRequestBodyContentApplicationJsonSchemaSendSms'
                INCALL_SMS:
                  $ref: '#/components/schemas/ActionsPostRequestBodyContentApplicationJsonSchemaIncallSms'
                INCALL_WHATSAPP:
                  $ref: '#/components/schemas/ActionsPostRequestBodyContentApplicationJsonSchemaIncallWhatsapp'
                CUSTOM_ACTION:
                  $ref: '#/components/schemas/ActionsPostRequestBodyContentApplicationJsonSchemaCustomAction'
                CUSTOM_EVAL:
                  $ref: '#/components/schemas/ActionsPostRequestBodyContentApplicationJsonSchemaCustomEval'
  /actions/initialize:
    post:
      operationId: initialize-action
      summary: Initialize a custom action
      description: ''
      tags:
      - Actions
      parameters:
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/initialize-action_Response_200'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Initialize-actionRequestBadRequestError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action_id:
                  type: string
                  description: The action id that will be initialized
                variables:
                  type: array
                  items:
                    $ref: '#/components/schemas/ActionsInitializePostRequestBodyContentApplicationJsonSchemaVariablesItems'
              required:
              - action_id
  /actions/{action_id}:
    put:
      operationId: update-action
      summary: Update an action
      description: ''
      tags:
      - Actions
      parameters:
      - name: action_id
        in: path
        description: To find an action's ID, go to its page in your Synthflow dashboard.
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update-action_Response_200'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update-actionRequestBadRequestError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                REAL_TIME_BOOKING:
                  $ref: '#/components/schemas/ActionsActionIdPutRequestBodyContentApplicationJsonSchemaRealTimeBooking'
                INFORMATION_EXTRACTOR:
                  $ref: '#/components/schemas/ActionsActionIdPutRequestBodyContentApplicationJsonSchemaInformationExtractor'
                LIVE_TRANSFER:
                  $ref: '#/components/schemas/ActionsActionIdPutRequestBodyContentApplicationJsonSchemaLiveTransfer'
                SEND_SMS:
                  $ref: '#/components/schemas/ActionsActionIdPutRequestBodyContentApplicationJsonSchemaSendSms'
                INCALL_SMS:
                  $ref: '#/components/schemas/ActionsActionIdPutRequestBodyContentApplicationJsonSchemaIncallSms'
                INCALL_WHATSAPP:
                  $ref: '#/components/schemas/ActionsActionIdPutRequestBodyContentApplicationJsonSchemaIncallWhatsapp'
                CUSTOM_ACTION:
                  $ref: '#/components/schemas/ActionsActionIdPutRequestBodyContentApplicationJsonSchemaCustomAction'
    delete:
      operationId: delete-action
      summary: Delete an action
      description: ''
      tags:
      - Actions
      parameters:
      - name: action_id
        in: path
        description: To find an action's ID, go to its page in your Synthflow dashboard.
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/delete-action_Response_200'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delete-actionRequestBadRequestError'
    get:
      operationId: get-action
      summary: Get an action
      description: Retrieves metadata about an action.
      tags:
      - Actions
      parameters:
      - name: action_id
        in: path
        description: To find an action's ID, go to its page in your Synthflow dashboard.
        required: true
        schema:
          type: string
      - name: include_assistants
        in: query
        description: Include assistant IDs assigned to this action.
        required: false
        schema:
          type: boolean
          default: false
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get-action_Response_200'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Get-actionRequestBadRequestError'
  /actions/attach:
    post:
      operationId: attach-action
      summary: Attach an action
      description: ''
      tags:
      - Actions
      parameters:
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/attach-action_Response_200'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attach-actionRequestBadRequestError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                model_id:
                  type: string
                  description: The ID of the agent you want to attach an action to.
                actions:
                  type: array
                  items:
                    type: string
                  description: To find an action's ID, go to its page in your Synthflow dashboard.
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/ActionsAttachPostRequestBodyContentApplicationJsonSchemaItemsItems'
                  description: Batch attach payload with per-action attachment configuration.
              required:
              - model_id
  /actions/detach:
    post:
      operationId: detach-action
      summary: Detach an action
      description: ''
      tags:
      - Actions
      parameters:
      - name: Authorization
        in: header
        description: Bearer authentication
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/detach-action_Response_200'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detach-actionRequestBadRequestError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                model_id:
                  type: string
                  description: The ID of the agent you want to detach an action from.
                actions:
                  type: array
                  items:
                    type: string
                  description: To find an action's ID, go to its page in your Synthflow dashboard.
              required:
              - model_id
components:
  schemas:
    ActionsAttachPostRequestBodyContentApplicationJsonSchemaItemsItems:
      type: object
      properties:
        action_id:
          type: string
          description: ID of the action to attach. Provide either `action_id` or `slug`.
        slug:
          type: string
          description: Slug of the action to attach. Provide either `action_id` or `slug`.
        attachment_type:
          oneOf:
          - $ref: '#/components/schemas/ActionsAttachPostRequestBodyContentApplicationJsonSchemaItemsItemsAttachmentType'
          - type: 'null'
          default: during
          description: When this action is available in the conversation. Optional and defaults to `during` when omitted or null.
        trigger_condition:
          type:
          - string
          - 'null'
          description: Per-assistant 'When to use this Action' condition describing when the agent should call this action. Currently applies to custom actions. Omit or send null to leave it unchanged; send an empty string to clear it.
        input_variables_mapping:
          type: array
          items:
            $ref: '#/components/schemas/ActionsAttachPostRequestBodyContentApplicationJsonSchemaItemsItemsInputVariablesMappingItems'
          description: Per-assistant mapping for this action's input variables.
      title: ActionsAttachPostRequestBodyContentApplicationJsonSchemaItemsItems
    ActionsInitializePostResponsesContentApplicationJsonSchemaResponse:
      type: object
      properties:
        answer:
          type: string
      title: ActionsInitializePostResponsesContentApplicationJsonSchemaResponse
    Update-actionRequestBadRequestError:
      type: object
      properties: {}
      title: Update-actionRequestBadRequestError
    ActionsPostRequestBodyContentApplicationJsonSchemaCustomActionVariablesDuringTheCallItemsType:
      type: string
      enum:
      - string
      - int
      - float
      - bool
      - list
      - money
      - phone_number
      - email
      - datetime
      - utc_datetime
      default: string
      description: Type of the variable
      title: ActionsPostRequestBodyContentApplicationJsonSchemaCustomActionVariablesDuringTheCallItemsType
    ActionsPostRequestBodyContentApplicationJsonSchemaLiveTransfer:
      oneOf:
      - $ref: '#/components/schemas/LiveTransferCreateDirectPhoneConfig'
      - $ref: '#/components/schemas/LiveTransferCreatePhoneBookConfig'
      title: ActionsPostRequestBodyContentApplicationJsonSchemaLiveTransfer
    attach-action_Response_200:
      type: object
      properties:
        status:
          type: string
        response:
          $ref: '#/components/schemas/ActionsAttachPostResponsesContentApplicationJsonSchemaResponse'
      title: attach-action_Response_200
    get-action_Response_200:
      type: object
      properties:
        status:
          type: string
        response:
          $ref: '#/components/schemas/ActionsActionIdGetResponsesContentApplicationJsonSchemaResponse'
      title: get-action_Response_200
    ActionsActionIdPutRequestBodyContentApplicationJsonSchemaCustomActionQueryParametersItems:
      type: object
      properties:
        key:
          type: string
          description: Key name
        value:
          type: string
          description: Value that will be assigned to the key
      required:
      - key
      - value
      title: ActionsActionIdPutRequestBodyContentApplicationJsonSchemaCustomActionQueryParametersItems
    ActionsActionIdGetResponsesContentApplicationJsonSchemaResponse:
      type: object
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionsActionIdGetResponsesContentApplicationJsonSchemaResponseActionsItems'
      title: ActionsActionIdGetResponsesContentApplicationJsonSchemaResponse
    HumanAvailabilityScheduleItemPublic:
      type: object
      properties:
        weekday:
          $ref: '#/components/schemas/HumanAvailabilityScheduleItemPublicWeekday'
          description: Lowercase full weekday name.
        interval:
          type: array
          items:
            $ref: '#/components/schemas/HumanAvailabilityIntervalPublic'
          description: Exactly one interval object per weekday.
      required:
      - weekday
      - interval
      description: Availability for a single weekday. Exactly one interval is currently supported.
      title: HumanAvailabilityScheduleItemPublic
    Initialize-actionRequestBadRequestError:
      type: object
      properties: {}
      title: Initialize-actionRequestBadRequestError
    ActionsGetResponsesContentApplicationJsonSchemaResponsePagination:
      type: object
      properties:
        total_records:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      title: ActionsGetResponsesContentApplicationJsonSchemaResponsePagination
    ActionsActionIdGetResponsesContentApplicationJsonSchemaResponseActionsItems:
      type: object
      properties:
        action_id:
          type: string
          description: Action ID.
        action_type:
          $ref: '#/components/schemas/ActionsActionIdGetResponsesContentApplicationJsonSchemaResponseActionsItemsActionType'
          description: Action type.
        name:
          type: string
          description: Action name.
        description:
          type: string
          description: Action description.
        assistants:
          type: array
          items:
            type: string
          description: Assistant IDs assigned to this action. Returned when `include_assistants=true`.
        input_variables:
          $ref: '#/components/schemas/ActionsActionIdGetResponsesContentApplicationJsonSchemaResponseActionsItemsInputVariables'
          description: Input variable details for this action, including variable definitions and attached assistant IDs.
        parameters_hard_coded:
          $ref: '#/components/schemas/ActionsActionIdGetResponsesContentApplicationJsonSchemaResponseActionsItemsParametersHardCoded'
      title: ActionsActionIdGetResponsesContentApplicationJsonSchemaResponseActionsItems
    status:
      type: string
      description: Whether the request was successful.
      title: status
    ActionsActionIdPutRequestBodyContentApplicationJsonSchemaSendSms:
      type: object
      properties:
        content:
          type: string
          description: The content/text of the SMS message
        instructions:
          type: string
          description: The instructions that will trigger the SMS message to be sent
      title: ActionsActionIdPutRequestBodyContentApplicationJsonSchemaSendSms
