          $ref: '#/components/schemas/AgentBackgroundNoise'
          description: Add background noise to make the call more natural.
        noise_cancellation:
          $ref: '#/components/schemas/AgentNoiseCancellation'
          description: Removes background noise on the customer's side (like chatter in a café or keyboard clicks) to make their voice clearer and easier for the agent to understand.
        realistic_filler_words:
          type: boolean
          description: If enabled, the agent will be using realistic filler words (for example, "um").
        is_transcript_disabled:
          type: boolean
          description: If set to true, conversations will not be transcribed.
        redact_pii:
          type: boolean
          description: Whether to redact personally identifiable information (PII) from transcripts, post-call webhooks, and internal logs. Redacted data includes credit card numbers, CVVs, expiration dates, social security numbers, names, email addresses, phone numbers, and physical addresses.
        synthesizer_filter_words:
          type: array
          items:
            description: Any type
          description: Words or characters that the agent should not say.
        end_call_reasons:
          type: array
          items:
            type: string
          description: 'Deprecated: use end_call_reasons_v2 instead. Custom conditions that trigger automatic call termination (simple string array format). Works with both simple prompt and Flow Designer agents.'
        end_call_reasons_v2:
          type: array
          items:
            $ref: '#/components/schemas/AgentEndCallReasonsV2Items'
          description: Custom conditions that trigger automatic call termination with per-reason closing message control. When both end_call_reasons and end_call_reasons_v2 are present, v2 takes precedence.
        voice_synthesizer:
          $ref: '#/components/schemas/AgentVoiceSynthesizer'
          description: The engine used to synthesize voice.
        suppression_level:
          type: number
          format: double
          description: Setting this value will enable voice isolation in addition to background noise detection, the value assigned the term is the strength with a higher value stronger voice isolation.
        interruption_fade_out:
          type: integer
          description: Each frame is 20 ms. When you interrupt the bot, the volume slowly goes down to 0 over that many frames. For example, 5 translates to a 100 ms fadeout.
        voice_speed:
          type: number
          format: double
          description: Adjust how fast or slow your agent will talk on the call.
        voice_volume:
          type: number
          format: double
          description: Adjust how loud or quite your agent will talk on the call.
        min_words_to_interrupt:
          $ref: '#/components/schemas/AgentMinWordsToInterrupt'
          description: You can set how many words the human must speak before the AI will stop speaking and listening.
        prompt:
          $ref: '#/components/schemas/prompt'
        greeting_message:
          $ref: '#/components/schemas/greeting_message'
        greeting_message_mode:
          $ref: '#/components/schemas/greeting_message_mode'
        greeting_message_human_talk_timeout:
          $ref: '#/components/schemas/greeting_message_human_talk_timeout'
        llm:
