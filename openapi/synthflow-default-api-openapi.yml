    LiveTransferCreateDirectPhoneConfig:
      type: object
      properties:
        transfer_mode:
          $ref: '#/components/schemas/LiveTransferCreateDirectPhoneConfigTransferMode'
          description: Transfer mode.
        message_to_transfer_target:
          type: string
          description: The message the human agent will hear after the call is transferred to them.
        phone:
          type: string
          description: Phone number to be called for transferring the call
        instructions:
          type: string
          description: 'What words can trigger the transfer call, for example: like I want to talk with a manager'
        timeout:
          type: integer
          description: How long to wait for the transfer call to happen before stop trying to do the transfer
        digits:
          type: string
          description: Extension digits for the transfer call
        initiating_msg:
          type: string
          description: Message that the agent will say before starting the transfer call
        goodbye_msg:
          type: string
          description: Message that the agent will say before leaving the call and connecting you with the transfer call number to start the conversation
        failed_msg:
          type: string
          description: The message that the agent will say in case the person that should answer the phone is not able to answer before the timeout
        stop_recording_after_transfer:
          type: boolean
          description: Whether the call should stop being recorded once it's transferred.
        human_detection:
          type: boolean
          description: If true, the agent will detect whether the transfer target is a human, and once detected, will complete the transfer to the target.
        human_detection_timeout_seconds:
          type: integer
          description: Time in seconds to wait for human detection before giving up. Used in conjunction with human_detection. Minimum 30 seconds, maximum 1800 seconds (30 minutes).
        summarization_prompt:
          type: string
          description: Custom prompt used to generate the warm transfer context summary for the warm transfer leg.
        preserve_caller_id:
          type: boolean
          description: If true, the transfer target will see the caller's phone number instead of the agent's phone number. Only works for numbers purchased through a Synthflow Twilio account; for other numbers the call will fail.
        screened:
          type: boolean
          description: If true, the transfer target will first speak with the AI agent, who can answer questions about the caller and the transcript. The transfer target can then choose to accept or decline the transfer.
      required:
      - transfer_mode
      - phone
      - instructions
      - initiating_msg
      title: LiveTransferCreateDirectPhoneConfig
    prompt:
      type: string
      description: Add variables in curly brackets. For example, <code>{your-variable}</code>.
      title: prompt
