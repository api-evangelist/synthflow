  name: Synthflow Platform API
  description: >-
    The Synthflow Platform API provides REST endpoints to manage assistants, phone numbers, calls, knowledge
    bases, and custom actions for no-code voice AI agents. Authentication is via bearer tokens and the
    API is available in multiple regions.
