  note: >-
    Corrected 2026-08-13. https://synthflow.ai/pricing publishes a single Enterprise tier
    starting at $30,000 annually with a Contact Sales call to action; the earlier
    self-serve/free reading came from a scaffolded plans file. Synthflow's own concurrency
    docs confirm the former Pro, Growth and Agency self-serve plans are retired and closed
    to new subscriptions.
