aid: synthflow
name: Synthflow
description: >-
  Synthflow is an enterprise-ready no-code Voice AI platform for automating
  phone conversations at scale. The product combines a visual agent designer
  with in-house telephony, sub-100ms latency, and a 99.99% uptime guarantee,
  so businesses can build, deploy, and operate voice agents without
  third-party carriers. Synthflow exposes a REST Platform API for assistants,
  calls, phone numbers, knowledge bases, and custom actions, with bearer
  token authentication. The platform claims more than 200 integrations
  including HubSpot, Salesforce, Cal.com, Zapier, and CCaaS systems, plus
  custom webhook actions. Compliance covers SOC 2, HIPAA, PCI DSS, and GDPR
  with end-to-end encryption and audit logging.
