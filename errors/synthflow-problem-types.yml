description: >-
  Error catalog derived from the 108 declared 4xx/5xx responses across the 100 operations
  of the Synthflow Platform API, enriched from the docs. Synthflow does NOT use RFC 9457
  problem+json — every response, success and failure, is application/json, and the failure
  envelope is a plain object. Most declared error responses carry no description beyond
  the status code repeated as a string, so an agent cannot tell 400 "bad phone number"
  from 400 "unknown model_id" without calling.

envelope:
  content_type: application/json
  observed_shapes:
    - {shape: '{"detail": "<message>"}', seen_on: 'unmatched routes on api.*.synthflow.ai, e.g. 404 {"detail":"Not Found"}'}
    - {shape: '{"error": "<slug>", "message": "<message>"}', seen_on: 'the api.synthflow.ai gateway, e.g. {"error":"not_found","message":"No route matched"}'}
  note: >-
    Two different envelopes are observable on the same estate — the regional FastAPI hosts
    answer with `detail`, the global gateway answers with `error`+`message`. Neither is
    declared in the OpenAPI as a reusable component.
rfc9457: false
problem_json_media_type_used: false

