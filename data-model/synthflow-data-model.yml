notes:
  - >-
    Agent is the hub of the graph: Calls, Chats, Actions, KnowledgeBases, PhoneNumbers,
    Voices, MemoryStores and SimulationCases all hang off model_id.
  - >-
    Attachment is modelled as verbs rather than sub-resources — attach/detach operations
    appear for actions, knowledge bases, phone numbers, memory stores and contacts,
    instead of PUT/DELETE on a nested collection.
  - >-
    Billing identifiers (stripe_subscription_id, synthflow_price_id, pricing_tier_id,
    agency_id) appear in schemas but have no operations, reflecting the agency rebilling
    surface that the 2026-07-29 changelog entry retires.
