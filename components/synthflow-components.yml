    No versioned front-end package is published — there is no npm element library, no
    CDN-pinned script and no web-component bundle. The widget is distributed as
    dashboard-generated embed code, so a consumer cannot pin or diff what they are
    loading. Recorded as a finding, not a gap in the probe.

